name: CI

# Builds and tests on Windows and Linux for every push and pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Pack
        run: dotnet pack QuickVB -c Release -o artifacts
      - uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.os }}
          path: artifacts/*.nupkg
